  <script src="assets/js/animations-legendary.js"></script>
  <script src="admin-legendary.js"></script>
  <script>
    function exportReport() {
      LegendaryAnimations.SoundDesign.success();
      LegendaryAnimations.HapticFeedback.success();
      // Generate CSV report
      const csv = 'المؤشر,القيمة\nالمستخدمون النشطون,12840\nحجوزات خدمات,3240\nطلبات توظيف,1870\nالإيرادات,48200';
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'jobezz-report-' + new Date().toISOString().split('T')[0] + '.csv';
      link.click();
      URL.revokeObjectURL(link.href);
    }
    function refreshData() {
      LegendaryAnimations.SoundDesign.whoosh();
      renderCurrentSection();
    }
  </script>
